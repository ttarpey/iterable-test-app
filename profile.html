<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iterable Test App - Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div id="header-root"></div>

  <main class="main-content">

    <div class="page-header">
      <div class="page-header-inner">
        <h1>User Profile</h1>
        <p>Fetch and update your Iterable user data fields in real time.</p>
      </div>
    </div>

    <div class="profile-section">
      <div class="container">
        <div id="emailWarning"></div>

        <div class="profile-grid">

          <!-- Sidebar -->
          <aside class="profile-sidebar">
            <div class="profile-avatar">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <h3 id="sidebarName">Unknown User</h3>
            <p id="sidebarEmail" style="word-break:break-all;">–</p>
            <div class="profile-status unknown" id="profileStatus">
              <span class="profile-status-dot"></span>
              <span id="profileStatusText">Not found in Iterable</span>
            </div>
            <div class="divider"></div>
            <button class="btn btn-secondary btn-full" id="fetchProfileBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
              Refresh from Iterable
            </button>
          </aside>

          <!-- Main form -->
          <div class="profile-card">
            <h2>Personal Details</h2>
            <p>Changes are saved directly to your Iterable user profile via the <code>users/update</code> API.</p>
            <div class="divider"></div>

            <div class="form-row">
              <div class="form-field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" class="input" placeholder="Jane">
              </div>
              <div class="form-field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" class="input" placeholder="Smith">
              </div>
            </div>

            <div class="form-field">
              <label for="profileEmail">Email Address</label>
              <input type="email" id="profileEmail" class="input" placeholder="jane@example.com" readonly
                     style="background:var(--color-bg); cursor:not-allowed;" title="Change your email using the header input">
              <small style="color:var(--color-text-muted); font-size:0.775rem;">
                To change your tracking email, update the field in the header.
              </small>
            </div>

            <div class="form-field">
              <label for="country">Country</label>
              <select id="country" class="input">
                <option value="">Select a country…</option>
                <option value="GB">United Kingdom</option>
                <option value="US">United States</option>
                <option value="AU">Australia</option>
                <option value="CA">Canada</option>
                <option value="DE">Germany</option>
                <option value="FR">France</option>
                <option value="ES">Spain</option>
                <option value="IT">Italy</option>
                <option value="NL">Netherlands</option>
                <option value="SE">Sweden</option>
                <option value="NO">Norway</option>
                <option value="DK">Denmark</option>
                <option value="FI">Finland</option>
                <option value="CH">Switzerland</option>
                <option value="IE">Ireland</option>
                <option value="NZ">New Zealand</option>
                <option value="SG">Singapore</option>
                <option value="JP">Japan</option>
                <option value="IN">India</option>
                <option value="ZA">South Africa</option>
              </select>
            </div>

            <div class="form-actions">
              <button class="btn btn-primary" id="saveProfileBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Save Profile
              </button>
              <button class="btn btn-secondary" id="clearProfileBtn">Clear Fields</button>
            </div>
          </div>

        </div>
      </div>
    </div>

  </main>

  <div id="footer-root"></div>
  <div id="cart-panel-root"></div>
</div>

<script src="js/config.js"></script>
<script src="js/iterable.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
  initComponents('profile');
  initApp('Profile');

  const email = getStoredEmail();

  // Populate email field
  function syncEmailDisplay() {
    const e = getStoredEmail();
    document.getElementById('profileEmail').value = e || '';
    document.getElementById('sidebarEmail').textContent = e || '–';
    if (!e) {
      document.getElementById('sidebarName').textContent = 'Unknown User';
      setStatus(false);
    }
  }
  syncEmailDisplay();

  function setStatus(known, name) {
    const statusEl = document.getElementById('profileStatus');
    const textEl   = document.getElementById('profileStatusText');
    if (known) {
      statusEl.className = 'profile-status known';
      textEl.textContent = 'Found in Iterable';
      if (name) document.getElementById('sidebarName').textContent = name;
    } else {
      statusEl.className = 'profile-status unknown';
      textEl.textContent = 'Not found in Iterable';
    }
  }

  // Populate form from Iterable user data
  function populateForm(user) {
    const df = user.dataFields || {};
    if (df.firstName) document.getElementById('firstName').value = df.firstName;
    if (df.lastName)  document.getElementById('lastName').value  = df.lastName;
    if (df.country) {
      const select = document.getElementById('country');
      select.value = df.country;
    }
    const name = [df.firstName, df.lastName].filter(Boolean).join(' ') || user.email;
    setStatus(true, name);
  }

  // Fetch profile on load if email is set
  async function fetchProfile() {
    const e = getStoredEmail();
    if (!e) {
      renderNoEmailBanner(document.getElementById('emailWarning'));
      return;
    }

    const btn = document.getElementById('fetchProfileBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner spinner-dark"></span> Fetching…`;

    const result = await getUser(e);

    btn.disabled = false;
    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
      Refresh from Iterable`;

    if (result.ok && result.data && result.data.user) {
      populateForm(result.data.user);
      showToast('Profile loaded from Iterable', 'success');
    } else if (result.ok) {
      setStatus(false);
      showToast('User not yet in Iterable – save a profile to create them.', 'info');
    } else {
      showToast(`Could not fetch profile: ${result.error}`, 'error');
    }
  }

  fetchProfile();

  // Save profile
  document.getElementById('saveProfileBtn').addEventListener('click', async () => {
    const e = getStoredEmail();
    if (!e) {
      showToast('Please enter your email in the header first.', 'error');
      return;
    }

    const btn = document.getElementById('saveProfileBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Saving…`;

    const dataFields = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName:  document.getElementById('lastName').value.trim(),
      country:   document.getElementById('country').value,
    };

    const result = await updateUser(dataFields);

    btn.disabled = false;
    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Save Profile`;

    if (result.ok) {
      const name = [dataFields.firstName, dataFields.lastName].filter(Boolean).join(' ') || e;
      setStatus(true, name);
      showToast('Profile saved to Iterable!', 'success');
    } else {
      showToast(`Save failed: ${result.error}`, 'error');
    }
  });

  // Clear form
  document.getElementById('clearProfileBtn').addEventListener('click', () => {
    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value  = '';
    document.getElementById('country').value   = '';
  });

  // Refresh button
  document.getElementById('fetchProfileBtn').addEventListener('click', fetchProfile);
</script>
</body>
</html>
