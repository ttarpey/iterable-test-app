<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop – CraftCXM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div id="header-root"></div>

  <main class="main-content">

    <div class="page-header">
      <div class="page-header-inner">
        <h1>Shop</h1>
        <p>Add products to your cart – each action fires an <code>updateCart</code> event to Iterable.</p>
      </div>
    </div>

    <div class="shop-section">
      <div class="container">
        <div id="emailWarning"></div>
        <div class="shop-grid" id="shopGrid"></div>
      </div>
    </div>

  </main>

  <div id="footer-root"></div>
  <div id="cart-panel-root"></div>
</div>

<script src="js/config.js"></script>
<script src="js/iterable.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
  initComponents('shop');
  initApp('shop', 'Shop');

  // Render product grid from config
  const grid = document.getElementById('shopGrid');

  PRODUCTS.forEach(product => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-img-wrap">
        <img src="${product.imageUrl}" alt="${product.name}" loading="lazy"
             onerror="this.src='https://picsum.photos/seed/fallback/400/300'">
        <span class="product-category">${product.category}</span>
      </div>
      <div class="product-body">
        <div class="product-name">${product.name}</div>
        <p class="product-desc">${product.description}</p>
      </div>
      <div class="product-footer">
        <span class="product-price">$${product.price.toFixed(2)}</span>
        <button class="add-to-cart-btn" data-id="${product.id}" aria-label="Add ${product.name} to cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add to Cart
        </button>
      </div>
    `;
    grid.appendChild(card);
  });

  // Wire up Add to Cart buttons
  grid.addEventListener('click', async e => {
    const btn = e.target.closest('.add-to-cart-btn');
    if (!btn) return;

    const product = PRODUCTS.find(p => p.id === btn.dataset.id);
    if (!product) return;

    // Visual feedback
    btn.classList.add('added');
    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Added
    `;
    btn.disabled = true;

    await addToCart(product);

    setTimeout(() => {
      btn.classList.remove('added');
      btn.disabled = false;
      btn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add to Cart
      `;
    }, 1500);
  });

  // No-email warning
  renderNoEmailBanner(document.getElementById('emailWarning'));
</script>
</body>
</html>
