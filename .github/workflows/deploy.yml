# CraftCXM — GitHub Pages Deployment
#
# Automatically deploys the app to GitHub Pages whenever you push to main.
#
# First-time setup:
#   1. Go to your GitHub repo → Settings → Pages
#   2. Under "Build and deployment", set Source to "GitHub Actions"
#   3. Push to main — this workflow handles the rest.
#
# Your app will be live at: https://<your-username>.github.io/<repo-name>/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Deploys everything in the repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
